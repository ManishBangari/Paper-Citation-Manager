name: Build and Deploy Code

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # These point at a throwaway database that only exists while this job runs, so none of them are secrets.
    env:
      DATABASE_HOSTNAME: localhost
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: fastapi
      SECRET_KEY: ci-only-key-not-used-anywhere-else
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_test       # the tests use <DATABASE_NAME>_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: pulling git repo
        uses: actions/checkout@v4
      - name: Install Python version 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            ui/requirements.txt
      - name: install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # the tests use fakeredis and a fake arXiv, so they need no Redis server and no internet
      - name: test with pytest
        run: pytest

  docker:
    name: Build the Docker images
    runs-on: ubuntu-24.04
    needs: [build]
    env:
      # empty unless you added the Docker Hub secrets; without them the images are built but not pushed
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
    steps:
      - name: pulling git repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKER_HUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build the API image (and push it on main when Docker Hub is set up)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKER_HUB_USERNAME != '' }}
          tags: |
            manishbangari/fastapi:latest
            manishbangari/fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the UI image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: false
          tags: paper-manager-ui:ci
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max
